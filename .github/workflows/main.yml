```yaml
name: Terraform Azure Pipeline

on:
  push:
    branches:
      - feature/106

  workflow_dispatch:

permissions:
  contents: read


jobs:

  # ==========================================================
  # JOB 1 - TEST SELF HOSTED RUNNER
  # ==========================================================
  runner-test:
    name: Test Self Hosted Runner
    runs-on: self-hosted

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Test Runner
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host "GitHub Actions Self Hosted Runner"
          Write-Host "======================================"

          Write-Host "Runner Name: $env:RUNNER_NAME"
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Runner Architecture: $env:RUNNER_ARCH"

          Write-Host ""
          Write-Host "Hostname:"
          hostname

          Write-Host ""
          Write-Host "Current User:"
          whoami


  # ==========================================================
  # JOB 2 - TERRAFORM
  # ==========================================================
  terraform:
    name: Terraform Init Plan
    runs-on: self-hosted

    needs:
      - runner-test

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # TERRAFORM VERSION
      # --------------------------------------------------------
      - name: Check Terraform
        shell: pwsh
        run: |
          Write-Host "Checking Terraform..."
          terraform version


      # --------------------------------------------------------
      # AZURE LOGIN
      # --------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # --------------------------------------------------------
      # CHECK AZURE LOGIN
      # --------------------------------------------------------
      - name: Check Azure Account
        shell: pwsh
        run: |
          Write-Host "Checking Azure connection..."
          az account show --output table


      # --------------------------------------------------------
      # TERRAFORM FORMAT
      # --------------------------------------------------------
      - name: Terraform Format Check
        shell: pwsh
        run: |
          Write-Host "Checking Terraform formatting..."
          terraform fmt -check -recursive


      # --------------------------------------------------------
      # TERRAFORM INIT
      # --------------------------------------------------------
      - name: Terraform Init
        shell: pwsh
        run: |
          Write-Host "Running Terraform Init..."
          terraform init


      # --------------------------------------------------------
      # TERRAFORM VALIDATE
      # --------------------------------------------------------
      - name: Terraform Validate
        shell: pwsh
        run: |
          Write-Host "Running Terraform Validate..."
          terraform validate


      # --------------------------------------------------------
      # TERRAFORM PLAN
      # --------------------------------------------------------
      - name: Terraform Plan
        shell: pwsh
        run: |
          Write-Host "Running Terraform Plan..."
          terraform plan -out=tfplan


      # --------------------------------------------------------
      # SHOW PLAN
      # --------------------------------------------------------
      - name: Terraform Show Plan
        shell: pwsh
        run: |
          Write-Host "Showing Terraform Plan..."
          terraform show tfplan
```
